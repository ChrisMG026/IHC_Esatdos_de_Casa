<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESIDENTE HUB - Iniciar Sesión</title>
    <link rel="stylesheet" href="../CSS/styles.css?v=4.3">
    <script>
        (function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark-mode-preload');
                if (document.body) document.body.classList.add('dark-mode');
            }
        })();
    </script>
    <style>
        .login-body { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-main); }
        .login-card { background: var(--bg-card); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border: 1px solid var(--border-color); text-align: center; }
        .login-card img { width: 60px; margin-bottom: 15px; }
        .login-card h2 { color: var(--text-primary); margin-bottom: 25px; font-size: 1.5rem; font-weight: 800; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-primary); outline: none; }
        .input-group input:focus { border-color: #6366f1; }
        .btn-login { width: 100%; padding: 12px; background: #6366f1; color: #fff; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-login:hover { background: #4f46e5; }
    </style>
</head>
<body class="login-body">

    <div class="login-card">
        <div class="brand" style="justify-content: center; margin-bottom: 20px;">
            <div class="brand-icon" style="width: 45px; height: 45px; font-size: 1.5rem;">R</div>
        </div>
        <h2>RESIDENTE HUB</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 25px;">Ingresa tus credenciales para acceder al sistema.</p>

        <form id="formLogin" onsubmit="ejecutarLogin(event)">
            <div class="input-group">
                <label>Usuario:</label>
                <input type="text" id="inpUsername" placeholder="Ej. admin" required autocomplete="username">
            </div>
            <div class="input-group">
                <label>Contraseña:</label>
                <input type="password" id="inpPassword" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="btnEntrar">Iniciar Sesión</button>
            <div style="margin-top: 20px; text-align: center;">
            <a href="recuperar.html" style="color: #6366f1; font-size: 0.85rem; font-weight: 600; text-decoration: none;">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </div>

    <div id="toastContainer" style="position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none;"></div>

    <script src="../JavaScript/login.js?v=1.0"></script>
</body>
</html>
